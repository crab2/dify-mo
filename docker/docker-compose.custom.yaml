# Compose override for the customized Dify web UI and domestic image sources.
#
# Usage from this directory:
#   docker compose -f docker-compose.yaml -f docker-compose.custom.yaml up -d --build
#
# To push and deploy a prebuilt private image, set CUSTOM_WEB_IMAGE in .env and
# build/push it separately, or keep this file as-is for local source builds.
#
# Docker Hub/GHCR/Quay/Elastic images are pulled through domestic proxy
# endpoints by default. Override these variables in docker/.env if you use a
# private registry, Harbor, or cloud ACR.
services:
  init_permissions:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/library/busybox:latest

  api:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/langgenius/dify-api:1.15.0

  api_websocket:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/langgenius/dify-api:1.15.0

  worker:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/langgenius/dify-api:1.15.0

  worker_beat:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/langgenius/dify-api:1.15.0

  web:
    image: ${CUSTOM_WEB_IMAGE:-dify-mo-web:latest}
    pull_policy: build
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        DOCKER_PROXY: ${DOCKER_PROXY:-docker.m.daocloud.io}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://mirrors.aliyun.com/alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}

  db_postgres:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/library/postgres:15-alpine

  db_mysql:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/library/mysql:8.0

  redis:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/library/redis:6-alpine

  sandbox:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/langgenius/dify-sandbox:0.2.15

  plugin_daemon:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/langgenius/dify-plugin-daemon:0.6.3-local

  ssrf_proxy:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/ubuntu/squid:latest

  certbot:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/certbot/certbot

  nginx:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/library/nginx:latest

  weaviate:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/semitechnologies/weaviate:1.27.0

  oceanbase:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/oceanbase/oceanbase-ce:4.3.5-lts

  seekdb:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/oceanbase/seekdb:latest

  qdrant:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/langgenius/qdrant:v1.8.3

  pgvector:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/pgvector/pgvector:pg16

  vastbase:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/vastdata/vastbase-vector

  pgvecto-rs:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/tensorchord/pgvecto-rs:pg16-v0.3.0

  chroma:
    image: ${GHCR_PROXY:-ghcr.m.daocloud.io}/chroma-core/chroma:0.5.20

  iris:
    image: ${INTERSYSTEMS_REGISTRY:-containers.intersystems.com}/intersystems/iris-community:2025.3

  oracle:
    image: ${ORACLE_REGISTRY:-container-registry.oracle.com}/database/free:latest

  etcd:
    image: ${QUAY_PROXY:-quay.m.daocloud.io}/coreos/etcd:v3.5.5

  minio:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/minio/minio:RELEASE.2023-03-20T20-16-18Z

  milvus-standalone:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/milvusdb/milvus:v2.6.3

  opensearch:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/opensearchproject/opensearch:latest

  opensearch-dashboards:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/opensearchproject/opensearch-dashboards:latest

  opengauss:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/opengauss/opengauss:7.0.0-RC1

  myscale:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/myscale/myscaledb:1.6.4

  matrixone:
    image: ${DOCKER_HUB_PROXY:-docker.m.daocloud.io}/matrixorigin/matrixone:2.1.1

  elasticsearch:
    image: ${ELASTIC_PROXY:-elastic.m.daocloud.io}/elasticsearch/elasticsearch:8.14.3

  kibana:
    image: ${ELASTIC_PROXY:-elastic.m.daocloud.io}/kibana/kibana:8.14.3

  unstructured:
    image: ${UNSTRUCTURED_REGISTRY:-downloads.unstructured.io}/unstructured-io/unstructured-api:latest
